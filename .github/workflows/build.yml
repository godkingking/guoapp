  docker:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/zhenguojian
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the service
        run: |
          set -euo pipefail
          mkdir -p ci-data

          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)

          docker run -d --name zhenguojian-core -p 18080:8080 \
            -e TOKEN=ci-token \
            -e PROXY_MODE=direct \
            -v "$PWD/ci-data:/data" \
            "$IMAGE"

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"ok":true' health.json
          grep -q '"allSources":true' health.json
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/api/sources | grep -q '"dsd"'
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/api/info | grep -q '"page":"/"'
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/api/settings | grep -q '"proxyMode":"direct"'
          curl -fsS -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/api/内部工具s | grep -q '"jobs"'
          curl -fsS http://127.0.0.1:18080/ > page.html
          grep -q '真果鉴' page.html
          grep -q '/hls.min.js' page.html
          grep -q '内部工具s-button' page.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/hls.min.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:18080/api/cover)" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/media/000000000000000000000000000000000000000000000000/000000000000000000000000.ts?token=ci-token")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/sources)" = "401"
          docker logs zhenguojian-core
          docker rm -f zhenguojian-core
